name: Publish npm

# Stages @frederik91/scriptbox on npm when a tag node-vX.Y.Z is pushed. npm
# trusts this workflow through OIDC (trusted publishing), so no npm token is
# stored, and the trusted publisher allows staging only: a maintainer approves
# each version with 2FA before it goes live. On a pull request that changes the
# package's version or this file, it runs the same steps as a dry run.
on:
  push:
    tags:
      - "node-v*"
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-npm.yml"
      - "ScriptBox.Node/package.json"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ScriptBox.Node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "node-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      # The package bundles this artifact, so it must be exactly what its pinned inputs build.
      - name: Check the guest artifact is current
        working-directory: .
        run: |
          bash ScriptBox.Wasm/docker-build.sh
          git diff --exit-code -- ScriptBox.Wasm
          test -z "$(git status --porcelain -- ScriptBox.Wasm)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ScriptBox.Node/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Packs the tarball and runs it in a clean Node 24 container with the network off.
      - name: Package test
        run: npm run test:package

      # Stages the version on npm; it goes live only when a maintainer approves it with 2FA.
      # prepublishOnly builds, type-checks, lints, tests and checks build-info.ts first.
      - name: Stage on npm
        run: |
          npm --version
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            npm stage publish --access public
          elif npm view "@frederik91/scriptbox@${version}" version > /dev/null 2>&1; then
            # npm refuses even a dry run of a published version, so check the release path without it.
            echo "${version} is already on npm, so this checks the package without staging it."
            npm run prepublishOnly
            npm pack --dry-run
          else
            npm stage publish --access public --dry-run
          fi
