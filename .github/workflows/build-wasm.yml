name: Build WASM

on:
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rebuilds the guest from the pinned inputs in toolchain.env.
      - name: Build WASM modules
        run: bash ScriptBox.Wasm/docker-build.sh

      # The committed artifacts must be exactly what their inputs build.
      - name: Check the committed artifacts are current
        run: |
          git status --porcelain -- ScriptBox.Wasm
          git diff --exit-code -- ScriptBox.Wasm
          test -z "$(git status --porcelain -- ScriptBox.Wasm)"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: scriptbox-wasm
          path: |
            ScriptBox.Wasm/scriptbox-async.wasm
            ScriptBox.Wasm/artifacts.json
          retention-days: 30

  build-and-test:
    needs: build-wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: scriptbox-wasm
          path: ScriptBox.Wasm/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build ScriptBox.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test ScriptBox.Tests/ScriptBox.Tests.csproj --configuration Release --no-build --verbosity normal
          dotnet test ScriptBox.SemanticKernel.Tests/ScriptBox.SemanticKernel.Tests.csproj --configuration Release --no-build --verbosity normal

  node:
    needs: build-wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScriptBox.Node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: ScriptBox.Node/package-lock.json

      - name: Install
        run: npm ci

      - name: Check build-info.ts matches the artifacts
        run: node scripts/build.ts --check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Packs the tarball and runs it in a clean Node 24 container with the network off.
      - name: Package test
        run: npm run test:package
